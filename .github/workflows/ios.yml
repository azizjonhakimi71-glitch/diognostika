name: Build iOS IPA (unsigned, for Sideloadly)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r RadiScanAI.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RadiScanAI-ipa
          path: RadiScanAI.ipa
